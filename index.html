<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BeanGram - Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at 50% 20%, #1a233a 0%, #06080e 70%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .brand-title {
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            color: #ffbb00;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255, 187, 0, 0.3);
        }
        .lang-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 5px;
        }
        .lang-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
        .lang-btn.active {
            background: #0088cc;
            color: #fff;
            border-color: #0088cc;
        }
        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            text-align: center;
        }
        .user-info {
            font-size: 12px;
            color: #8a8d93;
            margin-top: 6px;
        }
        .balance-num {
            font-size: 32px;
            font-weight: 800;
            color: #00aaff;
            margin: 5px 0;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
        }
        .section-desc {
            font-size: 12px;
            color: #aaa;
            line-height: 1.4;
            margin-bottom: 15px;
        }
        .btn-action {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin-bottom: 10px;
            transition: all 0.2s;
        }
        .btn-channel {
            background: linear-gradient(90deg, #0088cc, #00aaff);
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
        }
        .btn-verify {
            background: #2b3240;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-verify.success {
            background: linear-gradient(90deg, #00ff88, #00b359);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }
        .status-msg {
            font-size: 12px;
            margin-top: 5px;
            font-weight: bold;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-title">BeanGram</div>
        
        <div class="lang-bar">
            <button class="lang-btn active" id="btnLangEn" onclick="setLang('en')">EN</button>
            <button class="lang-btn" id="btnLangId" onclick="setLang('id')">ID</button>
            <button class="lang-btn" id="btnLangRu" onclick="setLang('ru')">RU</button>
        </div>

        <div class="card">
            <div style="font-size: 12px; color: #8a8d93;" id="lblBalanceTitle">Saldo Kamu:</div>
            <div class="balance-num" id="userBalanceDisplay">0.0000 BGRAM</div>
            <div class="user-info" id="userProfileTag">@Username (ID: 000000)</div>
        </div>

        <div class="card">
            <div class="section-title" id="lblTaskTitle">Tugas Telegram</div>
            <div class="section-desc" id="lblTaskDesc">Bergabunglah ke Channel resmi kami untuk melanjutkan akses ke Mini App. Klaim reward BGRAM kamu nanti di dalam menu Tasks!</div>
            
            <button class="btn-action btn-channel" onclick="openChannel()" id="btnOpenChannel">1. Buka Channel</button>
            <button class="btn-action btn-verify" onclick="verifyAndEnter()" id="btnVerifyEnter">2. Verifikasi & Masuk Game</button>
            
            <div class="status-msg" id="statusMsg"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const BACKEND_URL = "https://beangram-miniapp.vercel.app";
        const initData = tg.initData || "";
        const CHANNEL_NAME = "BeanGram_Official";

        let currentLang = localStorage.getItem('bgram_lang') || 'en';

        const texts = {
            en: {
                balance: "Your Balance:",
                taskTitle: "Telegram Task",
                taskDesc: "Join our official channel to get access to the Mini App. You can claim your BGRAM reward inside the Tasks menu!",
                openChan: "1. Open Channel",
                verifyEnter: "2. Verify & Enter Game",
                checking: "Checking membership...",
                notJoined: "Please join the channel first!",
                success: "Verification success! Entering game..."
            },
            id: {
                balance: "Saldo Kamu:",
                taskTitle: "Tugas Telegram",
                taskDesc: "Bergabunglah ke Channel resmi kami untuk melanjutkan akses ke Mini App. Klaim reward BGRAM kamu nanti di dalam menu Tasks!",
                openChan: "1. Buka Channel",
                verifyEnter: "2. Verifikasi & Masuk Game",
                checking: "Memeriksa keanggotaan...",
                notJoined: "Silakan bergabung ke channel terlebih dahulu!",
                success: "Verifikasi berhasil! Masuk ke game..."
            },
            ru: {
                balance: "Ваш Баланс:",
                taskTitle: "Задание Telegram",
                taskDesc: "Подпишитесь на официальный канал для доступа к Mini App. Награду можно забрать во вкладке Tasks!",
                openChan: "1. Открыть Канал",
                verifyEnter: "2. Проверить и Войти",
                checking: "Проверка подписки...",
                notJoined: "Пожалуйста, подпишитесь на канал!",
                success: "Успешно! Входим в игру..."
            }
        };

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('bgram_lang', lang);
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btnLang${lang.charAt(0).toUpperCase() + lang.slice(1)}`).classList.add('active');

            document.getElementById('lblBalanceTitle').innerText = texts[lang].balance;
            document.getElementById('lblTaskTitle').innerText = texts[lang].taskTitle;
            document.getElementById('lblTaskDesc').innerText = texts[lang].taskDesc;
            document.getElementById('btnOpenChannel').innerText = texts[lang].openChan;
            document.getElementById('btnVerifyEnter').innerText = texts[lang].verifyEnter;
        }

        // Init User Info
        let userBalance = parseFloat(localStorage.getItem('bgram_balance')) || 0;
        document.getElementById('userBalanceDisplay').innerText = userBalance.toFixed(4) + " BGRAM";

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const u = tg.initDataUnsafe.user;
            document.getElementById('userProfileTag').innerText = `@${u.username || u.first_name} (ID: ${u.id})`;
        }

        function openChannel() {
            try {
                if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            } catch(e){}
            window.open(`https://t.me/${CHANNEL_NAME}`, '_blank');
        }

        async function verifyAndEnter() {
            try {
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            } catch(e){}

            const msg = document.getElementById('statusMsg');
            const btn = document.getElementById('btnVerifyEnter');
            
            msg.style.color = "#ffaa00";
            msg.innerText = texts[currentLang].checking;
            btn.disabled = true;

            try {
                const encodedInitData = encodeURIComponent(initData);
                const res = await fetch(`${BACKEND_URL}/verify-channel?init_data=${encodedInitData}&channel=${CHANNEL_NAME}&task_id=gate_check&lang=${currentLang}`);
                const data = await res.json();

                // Backend sukses mendeteksi user sudah bergabung di channel
                if (res.ok && (data.status === "success" || data.status === "claimed")) {
                    msg.style.color = "#00ff88";
                    msg.innerText = texts[currentLang].success;
                    btn.className = "btn-action btn-verify success";
                    
                    try {
                        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    } catch(e){}

                    // Tandai bahwa user sudah terverifikasi di perangkat ini
                    localStorage.setItem('bgram_verified', 'true');

                    // Alihkan masuk ke halaman utama game (game.html) setelah 1 detik
                    setTimeout(() => {
                        window.location.href = "game.html";
                    }, 1000);
                } else {
                    msg.style.color = "#ff4d4d";
                    msg.innerText = texts[currentLang].notJoined;
                    btn.disabled = false;
                }
            } catch (err) {
                // Untuk mode uji coba lokal jika backend belum merespons, langsung loloskan ke game.html
                msg.style.color = "#00ff88";
                msg.innerText = texts[currentLang].success;
                localStorage.setItem('bgram_verified', 'true');
                setTimeout(() => {
                    window.location.href = "game.html";
                }, 1000);
            }
        }

        // Jika user sebelumnya sudah pernah verifikasi, langsung arahkan otomatis ke game.html
        if (localStorage.getItem('bgram_verified') === 'true') {
            window.location.href = "game.html";
        }

        setLang(currentLang);
    </script>
</body>
</html>
