<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BeanGram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            padding: 15px 15px 80px 15px;
        }
        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
        }
        .status-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
            background: #ffaa00;
            color: #000;
        }
        .btn-connect {
            background: #0088cc;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Balance Section */
        .balance-container {
            text-align: center;
            margin-top: 15px;
        }
        .balance-label {
            font-size: 11px;
            color: #8a8d93;
            letter-spacing: 1px;
        }
        .balance-value {
            font-size: 36px;
            font-weight: 800;
            color: #ffbb00;
            margin: 4px 0;
        }
        .sub-balance {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 12px;
            color: #aaa;
        }
        /* Mining Area & Coin */
        .mining-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .unclaimed-text {
            font-size: 26px;
            font-weight: 700;
            color: #00ff88;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
        .coin-wrapper {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            padding: 8px;
            background: linear-gradient(145deg, #ffbb00, #996600);
            box-shadow: 0 0 35px rgba(255, 187, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .coin-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        /* Action Button */
        .action-btn-container {
            width: 100%;
            max-width: 320px;
            margin-top: 30px;
        }
        .main-btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-start {
            background: linear-gradient(90deg, #ffbb00, #ff8800);
            color: #000;
            box-shadow: 0 4px 15px rgba(255, 187, 0, 0.4);
        }
        .btn-mining {
            background: rgba(255, 255, 255, 0.08);
            color: #8a8d93;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: default;
        }
        .btn-claim {
            background: linear-gradient(90deg, #00ff88, #00b359);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
        }
        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: #12161f;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #6c7079;
            font-size: 11px;
            cursor: pointer;
        }
        .nav-item.active {
            color: #ffbb00;
        }
        .nav-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="user-profile">
            <span id="username">Farmer</span>
            <span class="status-badge" id="statusBadge">IDLE</span>
        </div>
        <button class="btn-connect" onclick="alert('Fitur Wallet segera hadir!')">Connect Wallet</button>
    </div>

    <!-- Balance Section -->
    <div class="balance-container">
        <div class="balance-label">TOTAL ASSETS</div>
        <div class="balance-value" id="totalBalance">0.0000 BGRAM</div>
        <div class="sub-balance">
            <span>Vault: <b id="vaultBalance">0.0000</b></span>
            <span>Rate: <b>+2.0 BGRAM/5h</b></span>
        </div>
    </div>

    <!-- Mining Display -->
    <div class="mining-area">
        <div class="unclaimed-text" id="unclaimedText">+0.0000</div>
        
        <div class="coin-wrapper">
            <img src="Bgram.jpeg" alt="BeanGram Coin" class="coin-img" onerror="this.src='https://via.placeholder.com/200/0088cc/ffffff?text=BGRAM'">
        </div>

        <div class="action-btn-container">
            <button class="main-btn btn-start" id="actionBtn" onclick="handleButtonClick()">START FARMING</button>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <div class="nav-icon">⚡</div>
            <div>Mine</div>
        </div>
        <div class="nav-item" onclick="alert('Fitur Tasks segera hadir!')">
            <div class="nav-icon">📋</div>
            <div>Tasks</div>
        </div>
        <div class="nav-item" onclick="alert('Fitur Friends segera hadir!')">
            <div class="nav-icon">👥</div>
            <div>Friends</div>
        </div>
        <div class="nav-item" onclick="alert('Fitur Profile segera hadir!')">
            <div class="nav-icon">👤</div>
            <div>Profile</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
        }

        const FARM_DURATION = 5 * 60 * 60 * 1000; // 5 Jam (ms)
        const TOTAL_REWARD = 2.0; // Total 2 BGRAM per 5 jam

        let totalBalance = parseFloat(localStorage.getItem('bgram_balance')) || 0;
        let miningStartTime = parseInt(localStorage.getItem('bgram_start_time')) || 0;

        const actionBtn = document.getElementById('actionBtn');
        const unclaimedText = document.getElementById('unclaimedText');
        const totalBalanceElem = document.getElementById('totalBalance');
        const vaultBalanceElem = document.getElementById('vaultBalance');
        const statusBadge = document.getElementById('statusBadge');

        function updateUI() {
            totalBalanceElem.innerText = totalBalance.toFixed(4) + " BGRAM";
            vaultBalanceElem.innerText = totalBalance.toFixed(4);

            if (miningStartTime === 0) {
                // Status IDLE
                statusBadge.innerText = "IDLE";
                statusBadge.style.background = "#ffaa00";
                unclaimedText.innerText = "+0.0000";
                actionBtn.innerText = "START FARMING";
                actionBtn.className = "main-btn btn-start";
            } else {
                const now = Date.now();
                const elapsedTime = now - miningStartTime;

                if (elapsedTime >= FARM_DURATION) {
                    // Selesai Mining -> Siap CLAIM
                    statusBadge.innerText = "READY";
                    statusBadge.style.background = "#00ff88";
                    unclaimedText.innerText = "+" + TOTAL_REWARD.toFixed(4);
                    actionBtn.innerText = "CLAIM BGRAM";
                    actionBtn.className = "main-btn btn-claim";
                } else {
                    // Sedang Mining
                    statusBadge.innerText = "MINING";
                    statusBadge.style.background = "#0088cc";
                    
                    const progressRatio = elapsedTime / FARM_DURATION;
                    const currentReward = progressRatio * TOTAL_REWARD;
                    unclaimedText.innerText = "+" + currentReward.toFixed(4);

                    const remainingTime = FARM_DURATION - elapsedTime;
                    const hours = Math.floor(remainingTime / (1000 * 60 * 60));
                    const minutes = Math.floor((remainingTime % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((remainingTime % (1000 * 60)) / 1000);

                    const hStr = hours < 10 ? "0" + hours : hours;
                    const mStr = minutes < 10 ? "0" + minutes : minutes;
                    const sStr = seconds < 10 ? "0" + seconds : seconds;

                    actionBtn.innerText = `FARMING (${hStr}:${mStr}:${sStr})`;
                    actionBtn.className = "main-btn btn-mining";
                }
            }
        }

        function handleButtonClick() {
            const now = Date.now();
            if (miningStartTime === 0) {
                // Mulai Mining
                miningStartTime = now;
                localStorage.setItem('bgram_start_time', miningStartTime);
            } else if (now - miningStartTime >= FARM_DURATION) {
                // Klaim Reward
                totalBalance += TOTAL_REWARD;
                localStorage.setItem('bgram_balance', totalBalance);
                
                miningStartTime = 0;
                localStorage.removeItem('bgram_start_time');
            }
            updateUI();
        }

        // Loop per detik
        setInterval(updateUI, 1000);
        updateUI();
    </script>
</body>
</html>
