<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BeanGram ($BGRAM) Gateway</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        *{box-sizing:border-box;user-select:none;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
        body{background:#090d16;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;padding:20px;overflow:hidden;position:relative;}
        
        /* Background Glow Effect */
        .glow-bg{position:absolute;width:250px;height:250px;background:rgba(14,165,233,0.15);filter:blur(80px);border-radius:50%;z-index:0;}

        /* Gateway Card Container */
        .gateway-card{position:relative;z-index:1;background:rgba(15,23,42,0.85);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:30px 20px;width:100%;max-width:340px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.5);}
        
        /* Logo & Icon */
        .gateway-logo{width:80px;height:80px;background:linear-gradient(135deg,#0ea5e9,#2563eb);border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 8px 25px rgba(14,165,233,0.4);border:2px solid rgba(255,255,255,0.2);animation:pulseLogo 2s infinite ease-in-out;}
        @keyframes pulseLogo{0%{transform:scale(1);}50%{transform:scale(1.05);box-shadow:0 12px 30px rgba(14,165,233,0.6);}100%{transform:scale(1;)}}

        /* Typography */
        .gateway-title{font-size:22px;font-weight:800;color:#fff;margin-bottom:8px;letter-spacing:0.5px;}
        .gateway-subtitle{font-size:12px;color:#38bdf8;text-transform:uppercase;letter-spacing:1.5px;font-weight:bold;margin-bottom:20px;}
        .gateway-desc{font-size:11px;color:#94a3b8;line-height:1.5;margin-bottom:25px;}

        /* Action Button */
        .btn-enter{width:100%;padding:15px;border-radius:16px;border:none;font-size:13px;font-weight:bold;cursor:pointer;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;box-shadow:0 6px 20px rgba(14,165,233,0.4);text-transform:uppercase;letter-spacing:1.5px;transition:transform 0.1s;}
        .btn-enter:active{transform:scale(0.97);}

        /* Loading / Version Footer */
        .gateway-footer{margin-top:20px;font-size:10px;color:#64748b;letter-spacing:1px;}
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <div class="gateway-card">
        <div class="gateway-logo">🫘</div>
        <div class="gateway-title">BeanGram ($BGRAM)</div>
        <div class="gateway-subtitle">Ad Network & Task-to-Earn</div>
        <div class="gateway-desc">
            Welcome to the ultimate Web3 ecosystem. Complete tasks, launch campaigns, and earn real TON & BGRAM rewards seamlessly.
        </div>
        
        <button class="btn-enter" onclick="enterApp()">🚀 START APP</button>
        
        <div class="gateway-footer">SECURE TON CONNECTED v2.0</div>
    </div>

    <script>
        // Inisialisasi Telegram WebApp jika ada
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        function enterApp() {
            // Efek getar haptic Telegram jika didukung
            if (window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }
            // Langsung arahkan ke file visual utama game kita
            window.location.href = 'game.html';
        }
    </script>
</body>
</html>
