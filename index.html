<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BeanGram</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root{ --blue:#2F95FF; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{ background:var(--blue); height:100vh; display:flex; justify-content:center; align-items:center; flex-direction:column; overflow:hidden; }
  .stage{ display:flex; flex-direction:column; align-items:center; }
  .bean-wrap{
    animation: realBounce 2.2s cubic-bezier(0.68,-0.55,0.265,1.55) infinite;
    transform-origin: bottom center;
  }
  @keyframes realBounce{
    0%   { transform: translateY(-350px) scaleY(1.1) scaleX(0.9) rotate(-8deg); }
    18%  { transform: translateY(0px) scaleY(1) scaleX(1) rotate(0deg); }
    22%  { transform: translateY(14px) scaleY(0.68) scaleX(1.32) rotate(0deg); }
    30%  { transform: translateY(-75px) scaleY(1.12) scaleX(0.88) rotate(3deg); }
    42%  { transform: translateY(0px) scaleY(1) scaleX(1); }
    46%  { transform: translateY(8px) scaleY(0.82) scaleX(1.18); }
    55%  { transform: translateY(-32px) scaleY(1.05) scaleX(0.95); }
    68%  { transform: translateY(0px); }
    71%  { transform: translateY(4px) scaleY(0.92) scaleX(1.08); }
    78%  { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
  }
  /* UKURAN KACANG SEKARANG PAS - GAK JUMBO */
  .bean-svg{ width:118px; height:auto; filter: drop-shadow(0 20px 15px rgba(0,0,0,0.28)); }
  .logo-text{ 
    font-family:'Luckiest Guy', cursive; font-size:60px; line-height:0.85; color:white; text-align:center; 
    -webkit-text-stroke:4.5px black; text-shadow: 6px 7px 0px black; 
    transform:rotate(-4deg); margin-top:12px;
    animation: textImpact 2.2s ease-in-out infinite;
  }
  @keyframes textImpact{
    0%, 18% { transform: rotate(-4deg) scale(1); }
    22% { transform: rotate(-4deg) scale(0.94, 0.88); }
    30% { transform: rotate(-4deg) scale(1.02); }
    100% { transform: rotate(-4deg) scale(1); }
  }
  .logo-text span{ display:block; }
  .btn-open{ margin-top:40px; border:2.5px solid white; background:rgba(255,255,255,0.18); color:white; padding:12px 40px; border-radius:35px; font-weight:900; letter-spacing:1.5px; font-size:15px; cursor:pointer; }
  .ver{ position:absolute; bottom:22px; font-size:10px; opacity:0.75; color:white; letter-spacing:4px; font-weight:bold; }
</style>
</head>
<body>
  <div class="stage">
    <div class="bean-wrap">
      <!-- BEAN 1:1 DARI LOGO ASLI - LENGKUNGAN HALUS PRESISI -->
      <svg class="bean-svg" viewBox="0 0 120 175" xmlns="http://www.w3.org/2000/svg">
        <!-- Body kacang halus persis logo -->
        <path d="M 60 2 C 89 2, 115 24, 115 67 C 115 124, 85 173, 45 173 C 14 173, 2 144, 2 119 C 2 96, 23 86, 37 63 C 51 40, 28 2, 60 2 Z" fill="white" stroke="white" stroke-linejoin="round" stroke-width="2"/>
        <!-- Belahan biru presisi tengah, melengkung halus kayak logo -->
        <path d="M 68 48 C 80 64, 76 102, 40 126" stroke="#2F95FF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>
    <div class="logo-text"><span>BEAN</span><span>GRAM</span></div>
  </div>
  <button class="btn-open" onclick="openApp()">OPEN APP</button>
  <div class="ver">BEANGRAM V1.0</div>
<script>
  const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
  function openApp(){
    if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
    window.location.href="game.html";
  }
</script>
</body>
</html>
