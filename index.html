<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body{margin:0;background:#3A9CFF;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:white;text-align:center}
  .logo{width:140px;filter:drop-shadow(0 8px 15px rgba(0,0,0,.3))}
  .bean-title{font-size:42px;font-weight:900;line-height:.9;margin:15px 0;text-shadow:3px 3px 0 #000,-3px -3px 0 #000}
  .badge{background:#000;color:#fff;padding:4px 12px;border-radius:20px;font-size:12px;margin:10px 0;display:inline-block;letter-spacing:1px}
  .btn{width:85%;max-width:320px;padding:14px;border-radius:50px;border:3px solid #000;font-weight:900;margin:6px 0;cursor:pointer}
  .btn-join{background:#fff;color:#3A9CFF}
  .btn-open{background:#2d7dd1;color:#fff;opacity:.6;transition:.3s}
  .btn-open.unlocked{background:#fff;color:#3A9CFF;opacity:1;box-shadow:0 5px 0 #000}
</style>
</head>
<body>

<img class="logo" src="https://i.imgur.com/Q1p2o6H.png">
<div class="bean-title">BEAN<br>GRAM</div>
<div class="badge">🟢 WAITLIST LIVE</div>

<button class="btn btn-join" onclick="joinChannel()">JOIN @BEANGRAM_OFFICIAL</button>
<button id="openBtn" class="btn btn-open" onclick="tryOpen()">🔒 JOIN CHANNEL TO UNLOCK</button>

<div style="margin-top:60px;font-size:10px;letter-spacing:3px;opacity:.7">BEANGRAM V1.0</div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const CHANNEL_URL = "https://t.me/BeanGram_Official";
let hasJoined = localStorage.getItem('hasJoined') === 'true';

function updateButton(){
  const btn = document.getElementById('openBtn');
  if(hasJoined){
    btn.classList.add('unlocked');
    btn.innerHTML = "OPEN APP 🚀";
  }
}

function joinChannel(){
  if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
  // Buka channel
  tg.openTelegramLink ? tg.openTelegramLink(CHANNEL_URL) : window.open(CHANNEL_URL,'_blank');
  
  // Langsung unlock setelah 1 detik - TANPA VERIFIKASI
  setTimeout(()=>{
    hasJoined = true;
    localStorage.setItem('hasJoined','true');
    updateButton();
    if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  },1000);
}

function tryOpen(){
  const btn = document.getElementById('openBtn');
  if(!hasJoined){
    joinChannel(); // kalau belum join, suruh join dulu
    return;
  }
  if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
  location.href='game.html';
}

// Cek pas balik dari channel, auto unlock
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && hasJoined) updateButton();
});

// Saat load
if(hasJoined) updateButton();
</script>
</body>
</html>
