<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BeanGram</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#3599FF;
    height:100vh;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;
    position:relative;
  }
  /* PETA SAMAR BAWAH PERSIS REFERENSI */
  body::after{
    content:"";
    position:absolute;bottom:-10%;left:-5%;width:110%;height:45%;
    background:url('https://i.ibb.co/7Qp4k0T/map-uk.png') no-repeat bottom center / contain;
    opacity:0.18;filter:brightness(2);
    pointer-events:none;
  }
  /* KACANG LONCAT DI ATAS */
  .bean-wrap{
    margin-top:8vh;position:relative;
    animation:floatBean 1.2s ease-in-out infinite alternate;
    filter:drop-shadow(0 15px 15px rgba(0,0,0,0.2));
  }
  .bean-wrap::before{
    content:"";position:absolute;top:-28px;left:50%;width:90%;height:14px;
    transform:translateX(-50%);
    background:
      radial-gradient(ellipse at center, transparent 60%, white 61%) 0 0 / 100% 8px no-repeat,
      radial-gradient(ellipse at center, transparent 60%, white 61%) 0 8px / 85% 8px no-repeat;
    opacity:0.9;
  }
  .bean{
    width:148px;height:auto;
  }
  @keyframes floatBean{
    0%{transform:translateY(0) rotate(-8deg)}
    100%{transform:translateY(12px) rotate(-2deg)}
  }

  /* TULISAN GRAVITY */
  .gravity{
    margin-top:2vh;width:88%;max-width:420px;
    filter:drop-shadow(0 8px 0 rgba(0,0,0,0.15));
  }

  /* TOMBOL OPEN APP PERSIS REFERENSI */
  .btn-open{
    margin-top:6vh;z-index:2;
    border:1.8px solid white;background:transparent;
    color:white;padding:10px 38px;border-radius:30px;
    font-weight:800;letter-spacing:0.8px;font-size:15px;
    font-family:system-ui;
  }
  .btn-open:active{transform:scale(0.96);background:white;color:#3599FF}
  .ver{position:absolute;bottom:22px;font-size:10px;color:white;opacity:0.6;letter-spacing:3px;z-index:2}
</style>
</head>
<body>
  <div class="bean-wrap">
    <!-- KACANG PUTIH POLOS PERSIS REFERENSI -->
    <svg class="bean" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
      <path d="M 25 5 C 55 5, 90 25, 85 65 C 80 105, 50 135, 20 125 C 0 118, -5 90, 10 70 C 22 55, 5 10, 25 5 Z" fill="white"/>
    </svg>
  </div>

  <!-- GRAVITY TEXT - PAKAI GAMBAR CROP 100% MIRIP -->
  <img class="gravity" src="public/beangram_gravity.png" alt="Bean Gram">

  <button class="btn-open" onclick="location.href='game.html'">OPEN APP</button>
  <div class="ver">BEANGRAM V1.0</div>

<script>Telegram.WebApp.ready();Telegram.WebApp.expand();</script>
</body>
</html>
