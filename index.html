<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BeanGram</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root{--blue:#2F95FF}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--blue);height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;overflow:hidden}
  .stage{display:flex;flex-direction:column;align-items:center}
  .bean-logo{width:138px;height:auto;filter:drop-shadow(0 12px 18px rgba(0,0,0,0.28));margin-bottom:12px}
  .logo-text{font-family:'Luckiest Guy',cursive;font-size:64px;line-height:0.85;color:white;text-align:center;-webkit-text-stroke:4.5px black;text-shadow:6px 7px 0 black;transform:rotate(-4deg)}
  .logo-text span{display:block}
  .btn-open{margin-top:42px;border:2.5px solid white;background:rgba(255,255,255,0.18);color:white;padding:13px 46px;border-radius:35px;font-weight:900;letter-spacing:1.5px;font-size:15px;cursor:pointer;backdrop-filter:blur(6px)}
  .btn-open:active{transform:scale(0.96);background:white;color:var(--blue)}
  .ver{position:absolute;bottom:22px;font-size:10px;opacity:0.8;color:white;letter-spacing:4px;font-weight:700}
</style>
</head>
<body>
<div class="stage">
  <img class="bean-logo" src="public/bean.jpg" alt="BeanGram">
  <div class="logo-text"><span>BEAN</span><span>GRAM</span></div>
</div>
<button class="btn-open" onclick="location.href='game.html'">OPEN APP</button>
<div class="ver">BEANGRAM V1.0</div>
<script>Telegram.WebApp.ready();Telegram.WebApp.expand();</script>
</body>
</html>
