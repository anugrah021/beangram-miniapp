<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeanGram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1c1d22;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            background-color: #28292e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .balance {
            font-size: 32px;
            font-weight: bold;
            color: #0088cc;
            margin: 10px 0;
        }
        .btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #status-msg {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h2>BeanGram Task Center</h2>

    <!-- Card Informasi User & Saldo -->
    <div class="card">
        <div>Saldo Kamu:</div>
        <div class="balance" id="user-balance">0 BGRAM</div>
        <div id="user-info">Memuat data user...</div>
    </div>

    <!-- Card Task Join Channel -->
    <div class="card">
        <h3>Tugas Telegram</h3>
        <p>Bergabunglah ke Channel resmi kami untuk mendapatkan 500 BGRAM.</p>
        <button class="btn" onclick="openChannel()">1. Buka Channel</button>
        <button class="btn" id="claim-btn" onclick="verifyTask('task_channel_1', 'BeanGram_Official')">2. Verifikasi & Klaim</button>
    </div>

    <div id="status-msg"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Perluas layar Telegram Mini App

        // URL Backend Vercel milikmu yang sudah dikonfigurasi
        const BACKEND_URL = "https://beangram-miniapp.vercel.app"; 

        const user = tg.initDataUnsafe?.user || { id: 12345678, username: "DemoUser" };
        const telegramId = user.id;
        const username = user.username || "NoUsername";

        document.getElementById("user-info").innerText = `@${username} (ID: ${telegramId})`;

        // 1. Fungsi Ambil Saldo User dari Supabase via Backend
        async function fetchUserData() {
            try {
                const res = await fetch(`${BACKEND_URL}/get-user?telegram_id=${telegramId}`);
                const data = await res.json();
                if (data.status === "success") {
                    document.getElementById("user-balance").innerText = `${data.user.balance} BGRAM`;
                }
            } catch (err) {
                console.error("Gagal mengambil data user:", err);
            }
        }

        // 2. Buka Link Channel Telegram
        function openChannel() {
            tg.openTelegramLink("https://t.me/BeanGram_Official");
        }

        // 3. Verifikasi Keanggotaan & Klaim Task
        async function verifyTask(taskId, channelUsername) {
            const claimBtn = document.getElementById("claim-btn");
            const statusMsg = document.getElementById("status-msg");

            claimBtn.disabled = true;
            claimBtn.innerText = "Memeriksa...";
            statusMsg.innerText = "";

            try {
                const url = `${BACKEND_URL}/verify-channel?telegram_id=${telegramId}&username=${username}&channel=${channelUsername}&task_id=${taskId}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.status === "success") {
                    statusMsg.style.color = "#4CAF50";
                    statusMsg.innerText = data.message;
                    document.getElementById("user-balance").innerText = `${data.balance} BGRAM`;
                    claimBtn.innerText = "Sudah Diklaim";
                } else if (data.status === "claimed") {
                    statusMsg.style.color = "#FFC107";
                    statusMsg.innerText = data.message;
                    claimBtn.innerText = "Sudah Diklaim";
                } else {
                    statusMsg.style.color = "#F44336";
                    statusMsg.innerText = data.message;
                    claimBtn.disabled = false;
                    claimBtn.innerText = "2. Verifikasi & Klaim";
                }
            } catch (err) {
                statusMsg.style.color = "#F44336";
                statusMsg.innerText = "Terjadi kesalahan koneksi ke server.";
                claimBtn.disabled = false;
                claimBtn.innerText = "2. Verifikasi & Klaim";
            }
        }

        // Jalankan pemanggilan data saldo saat aplikasi terbuka
        fetchUserData();
    </script>
</body>
</html>
