<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BeanGram - Welcome Gate</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #fae8ff 50%, #fef3c7 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1e293b;
            --primary-purple: #7c3aed;
            --shadow-3d: 0 15px 35px -5px rgba(124, 58, 237, 0.15), 0 5px 15px rgba(0, 0, 0, 0.05);
            --radius-box: 28px;
        }

        * {box-sizing: border-box; user-select: none; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent;}

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Efek Dekoratif Karakter Bean Pastel di Background Gerbang */
        body::before {
            content: '🫘 ☁️ ✨ 🫘 🌟 ☁️ 🫘';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            font-size: 32px;
            opacity: 0.12;
            z-index: 0;
            pointer-events: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-content: space-around;
            letter-spacing: 40px;
            line-height: 120px;
        }

        .welcome-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 3px solid #ffffff;
            border-radius: var(--radius-box);
            padding: 30px 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: var(--shadow-3d);
            position: relative;
            z-index: 1;
            animation: floatCard 3s ease-in-out infinite alternate;
        }

        @keyframes floatCard {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        .welcome-icon-box {
            width: 85px;
            height: 85px;
            background: linear-gradient(135deg, rgba(124,58,237,0.1), rgba(56,189,248,0.15));
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            border: 3px solid #ffffff;
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.12);
        }

        .welcome-title {
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(135deg, #7c3aed, #0284c7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .welcome-desc {
            font-size: 13px;
            color: #475569;
            line-height: 1.5;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .enter-btn {
            width: 100%;
            padding: 16px;
            border-radius: 18px;
            border: none;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            background: linear-gradient(135deg, #38bdf8, #7c3aed);
            color: #fff;
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.35);
            transition: 0.2s;
            letter-spacing: 0.5px;
        }

        .enter-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="welcome-icon-box">🫘</div>
        <div class="welcome-title">BeanGram Ecosystem</div>
        <div class="welcome-desc">
            Selamat datang di dunia Web3 kasual yang ceria! Kumpulkan token $BGRAM, selesaikan tugas, dan nikmati ekosistemnya.
        </div>
        <button class="enter-btn" onclick="enterApp()">MASUK KE APLIKASI</button>
    </div>

    <script>
        function enterApp() {
            // Langsung mengarahkan ke file game utama tanpa hambatan backend untuk tahap uji coba ini
            window.location.href = 'game.html';
        }
    </script>
</body>
</html>
