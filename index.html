<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BeanGram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            padding: 15px 15px 80px 15px;
        }
        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
        }
        .btn-connect {
            background: #0088cc;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Balance Container */
        .balance-container {
            text-align: center;
            margin-top: 15px;
        }
        .balance-label {
            font-size: 12px;
            color: #8a8d93;
            letter-spacing: 1px;
        }
        .balance-value {
            font-size: 38px;
            font-weight: 800;
            color: #ffbb00;
            margin: 5px 0;
        }
        .sub-balance {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 11px;
            color: #6c7079;
        }
        /* Mining Area */
        .mining-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .bean-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffaa00 0%, #996600 100%);
            border: 6px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.05s ease;
        }
        .bean-btn:active {
            transform: scale(0.93);
        }
        /* Energy & Controls */
        .energy-bar-container {
            width: 100%;
            max-width: 280px;
            margin-top: 20px;
        }
        .energy-text {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 5px;
            color: #aaa;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            width: 100%;
            height: 100%;
            background: #ffbb00;
            transition: width 0.2s;
        }
        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: #12161f;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #6c7079;
            font-size: 11px;
            text-decoration: none;
            cursor: pointer;
        }
        .nav-item.active {
            color: #ffbb00;
        }
        .nav-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="user-profile">
            <span id="username">Farmer</span>
        </div>
        <button class="btn-connect" onclick="alert('Fitur Wallet segera hadir!')">Connect Wallet</button>
    </div>

    <!-- Balance Display -->
    <div class="balance-container">
        <div class="balance-label">TOTAL ASSETS</div>
        <div class="balance-value" id="balance">0.0000</div>
        <div class="sub-balance">
            <span>Vault: <b id="vault">0.0000</b></span>
            <span>Staked: <b>0.0000</b></span>
        </div>
    </div>

    <!-- Mining Area -->
    <div class="mining-area">
        <div class="bean-btn" id="tapBtn" onclick="tapBean()">$BGRAM</div>
        <div class="energy-bar-container">
            <div class="energy-text">
                <span>⚡ Energy</span>
                <span id="energyText">1000 / 1000</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="energyFill"></div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <div class="nav-icon">⛏️</div>
            <div>Farm</div>
        </div>
        <div class="nav-item" onclick="alert('Fitur Tasks segera hadir!')">
            <div class="nav-icon">📋</div>
            <div>Tasks</div>
        </div>
        <div class="nav-item" onclick="alert('Fitur Referral segera hadir!')">
            <div class="nav-icon">👥</div>
            <div>Friends</div>
        </div>
        <div class="nav-item" onclick="alert('Fitur Profile segera hadir!')">
            <div class="nav-icon">👤</div>
            <div>Profile</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
        }

        let balance = 0.0000;
        let energy = 1000;
        const maxEnergy = 1000;

        function tapBean() {
            if (energy >= 1) {
                balance += 0.0010;
                energy -= 1;
                
                document.getElementById('balance').innerText = balance.toFixed(4);
                document.getElementById('vault').innerText = balance.toFixed(4);
                document.getElementById('energyText').innerText = energy + " / " + maxEnergy;
                document.getElementById('energyFill').style.width = (energy / maxEnergy * 100) + "%";

                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('light');
                }
            }
        }

        // Auto Regen Energy Setiap Detik
        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 1;
                document.getElementById('energyText').innerText = energy + " / " + maxEnergy;
                document.getElementById('energyFill').style.width = (energy / maxEnergy * 100) + "%";
            }
        }, 1000);
    </script>
</body>
</html>
