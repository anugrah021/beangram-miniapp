<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BeanGram Mini App</title>
    <!-- SDK Resmi Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #0f0f11;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-top: 20px;
        }
        .user-info {
            font-size: 14px;
            color: #8e8e93;
            margin-bottom: 5px;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            color: #0088cc;
        }
        .balance-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 40px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            width: 80%;
        }
        .balance-title {
            color: #8e8e93;
            font-size: 12px;
            letter-spacing: 1px;
        }
        .balance-amount {
            font-size: 42px;
            font-weight: 800;
            color: #34c759;
            margin-top: 5px;
        }
        .btn-mine {
            background: radial-gradient(circle, #0088cc 0%, #005588 100%);
            color: white;
            border: 4px solid rgba(255, 255, 255, 0.2);
            width: 180px;
            height: 180px;
            border-radius: 50%;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0, 136, 204, 0.5);
            cursor: pointer;
            transition: transform 0.05s ease;
            outline: none;
        }
        .btn-mine:active {
            transform: scale(0.92);
        }
        .footer {
            margin-bottom: 20px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info" id="username">Halo, Farmer!</div>
        <div class="title">BeanGram Mining</div>
    </div>

    <div class="balance-card">
        <div class="balance-title">SALDO $BGRAM</div>
        <div class="balance-amount" id="balance">0</div>
    </div>

    <button class="btn-mine" onclick="farmToken()">TAP / FARM</button>

    <div class="footer">Powered by TON Network</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = "Halo, " + tg.initDataUnsafe.user.first_name + "!";
        }

        let balance = 0;
        function farmToken() {
            balance += 1;
            document.getElementById('balance').innerText = balance;
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }
    </script>
</body>
</html>
