<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeanGram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1c1d22;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .lang-switcher {
            display: flex;
            gap: 5px;
            background: #28292e;
            padding: 4px;
            border-radius: 20px;
        }
        .lang-btn {
            background: transparent;
            border: none;
            color: #aaa;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
        }
        .lang-btn.active {
            background: #0088cc;
            color: white;
        }
        .card {
            background-color: #28292e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .balance {
            font-size: 32px;
            font-weight: bold;
            color: #0088cc;
            margin: 10px 0;
        }
        .btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #status-msg {
            margin-top: 15px;
            font-size: 14px;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h3 style="margin:0;">BeanGram</h3>
        <div class="lang-switcher">
            <button class="lang-btn" id="lang-en" onclick="setLanguage('en')">EN</button>
            <button class="lang-btn" id="lang-id" onclick="setLanguage('id')">ID</button>
            <button class="lang-btn" id="lang-ru" onclick="setLanguage('ru')">RU</button>
        </div>
    </div>

    <!-- Card Informasi User & Saldo -->
    <div class="card">
        <div id="lbl-balance-title">Your Balance:</div>
        <div class="balance" id="user-balance">0 BGRAM</div>
        <div id="user-info">Loading user info...</div>
    </div>

    <!-- Card Task Join Channel -->
    <div class="card">
        <h3 id="lbl-task-title">Telegram Task</h3>
        <p id="lbl-task-desc">Join our official channel to get 500 BGRAM.</p>
        <button class="btn" id="btn-open-channel" onclick="openChannel()">1. Open Channel</button>
        <button class="btn" id="claim-btn" onclick="verifyTask('task_channel_1', 'BeanGram_Official')">2. Verify & Claim</button>
    </div>

    <div id="status-msg"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const BACKEND_URL = "https://beangram-miniapp.vercel.app"; 
        const initData = tg.initData || ""; 

        const user = tg.initDataUnsafe?.user || { id: 12345678, username: "DemoUser", language_code: "en" };
        const telegramId = user.id;
        const username = user.username || "NoUsername";

        const i18n = {
            en: {
                balanceTitle: "Your Balance:",
                loadingUser: "Loading user info...",
                taskTitle: "Telegram Task",
                taskDesc: "Join our official channel to get 500 BGRAM.",
                btnOpen: "1. Open Channel",
                btnClaim: "2. Verify & Claim",
                checking: "Checking...",
                claimed: "Already Claimed",
                connError: "Connection error to server."
            },
            id: {
                balanceTitle: "Saldo Kamu:",
                loadingUser: "Memuat data user...",
                taskTitle: "Tugas Telegram",
                taskDesc: "Bergabunglah ke Channel resmi kami untuk mendapatkan 500 BGRAM.",
                btnOpen: "1. Buka Channel",
                btnClaim: "2. Verifikasi & Klaim",
                checking: "Memeriksa...",
                claimed: "Sudah Diklaim",
                connError: "Terjadi kesalahan koneksi ke server."
            },
            ru: {
                balanceTitle: "Ваш баланс:",
                loadingUser: "Загрузка данных...",
                taskTitle: "Задание Telegram",
                taskDesc: "Присоединяйтесь к нашему официальному каналу, чтобы получить 500 BGRAM.",
                btnOpen: "1. Открыть канал",
                btnClaim: "2. Проверить и получить",
                checking: "Проверка...",
                claimed: "Уже получено",
                connError: "Ошибка подключения к серверу."
            }
        };

        let currentLang = "en";
        const tgLang = (user.language_code || "").toLowerCase();
        if (tgLang.startsWith("id")) currentLang = "id";
        else if (tgLang.startsWith("ru")) currentLang = "ru";

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`lang-${lang}`).classList.add('active');

            const t = i18n[lang];
            document.getElementById("lbl-balance-title").innerText = t.balanceTitle;
            document.getElementById("lbl-task-title").innerText = t.taskTitle;
            document.getElementById("lbl-task-desc").innerText = t.taskDesc;
            document.getElementById("btn-open-channel").innerText = t.btnOpen;

            const claimBtn = document.getElementById("claim-btn");
            if (!claimBtn.disabled || claimBtn.getAttribute("data-state") !== "claimed") {
                claimBtn.innerText = t.btnClaim;
            } else {
                claimBtn.innerText = t.claimed;
            }
        }

        document.getElementById("user-info").innerText = `@${username} (ID: ${telegramId})`;

        async function fetchUserData() {
            try {
                const encodedInitData = encodeURIComponent(initData);
                const res = await fetch(`${BACKEND_URL}/get-user?init_data=${encodedInitData}`);
                const data = await res.json();
                if (data.status === "success" && data.user) {
                    document.getElementById("user-balance").innerText = `${data.user.balance} BGRAM`;
                }
            } catch (err) {
                console.error("Gagal mengambil data user:", err);
            }
        }

        function openChannel() {
            tg.openTelegramLink("https://t.me/BeanGram_Official");
        }

        async function verifyTask(taskId, channelUsername) {
            const claimBtn = document.getElementById("claim-btn");
            const statusMsg = document.getElementById("status-msg");
            const t = i18n[currentLang];

            claimBtn.disabled = true;
            claimBtn.innerText = t.checking;
            statusMsg.innerText = "";

            try {
                const encodedInitData = encodeURIComponent(initData);
                const url = `${BACKEND_URL}/verify-channel?init_data=${encodedInitData}&channel=${channelUsername}&task_id=${taskId}&lang=${currentLang}`;
                const res = await fetch(url);
                const data = await res.json();

                if (res.ok && data.status === "success") {
                    statusMsg.style.color = "#4CAF50";
                    statusMsg.innerText = data.message;
                    document.getElementById("user-balance").innerText = `${data.balance} BGRAM`;
                    claimBtn.innerText = t.claimed;
                    claimBtn.setAttribute("data-state", "claimed");
                } else if (data.status === "claimed") {
                    statusMsg.style.color = "#FFC107";
                    statusMsg.innerText = data.message;
                    claimBtn.innerText = t.claimed;
                    claimBtn.setAttribute("data-state", "claimed");
                } else {
                    statusMsg.style.color = "#F44336";
                    // TAMPILKAN PESAN TERPERINCI DARI BACKEND
                    statusMsg.innerText = data.message || data.detail || t.connError;
                    claimBtn.disabled = false;
                    claimBtn.innerText = t.btnClaim;
                }
            } catch (err) {
                statusMsg.style.color = "#F44336";
                statusMsg.innerText = t.connError;
                claimBtn.disabled = false;
                claimBtn.innerText = t.btnClaim;
            }
        }

        setLanguage(currentLang);
        fetchUserData();
    </script>
</body>
</html>
