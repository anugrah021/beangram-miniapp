<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BeanGram</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root{--blue:#2F95FF}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--blue);height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;overflow:hidden;position:relative}

 .stage{position:relative;width:260px;height:300px;display:flex;justify-content:flex-end;align-items:center;flex-direction:column}

  /* Tempat numpuk kacang di atas tulisan */
 .pile-area{position:absolute;top:0;left:0;width:100%;height:140px;z-index:5;pointer-events:none}

 .mini-bean{
    position:absolute;
    width:38px;height:auto;
    filter:drop-shadow(0 6px 6px rgba(0,0,0,0.25));
    will-change:transform;
  }

  /* Animasi jatuh */
  @keyframes fall{
    0%{transform:translateY(-200px) rotate(0deg) scale(0.8);opacity:0}
    10%{opacity:1}
    85%{transform:translateY(var(--y)) rotate(var(--r)) scale(1)}
    90%{transform:translateY(calc(var(--y) + 10px)) rotate(var(--r)) scaleX(1.25) scaleY(0.75)} /* peot pas numpuk */
    100%{transform:translateY(var(--y)) rotate(var(--r)) scale(1)}
  }

 .bean-svg{width:100%;height:auto}

 .logo-text{
    font-family:'Luckiest Guy',cursive;font-size:62px;line-height:0.85;color:white;text-align:center;
    -webkit-text-stroke:4.5px black;text-shadow:6px 7px 0 black;
    transform:rotate(-4deg);z-index:2;margin-top:10px;
  }
 .logo-text span{display:block}

 .btn-open{margin-top:35px;border:2.5px solid white;background:rgba(255,255,255,0.18);color:white;padding:12px 44px;border-radius:35px;font-weight:900;letter-spacing:1.5px;font-size:15px;cursor:pointer;backdrop-filter:blur(6px);z-index:10}
 .btn-open:active{transform:scale(0.94);background:white;color:var(--blue)}
 .ver{position:absolute;bottom:22px;font-size:10px;opacity:0.75;color:white;letter-spacing:4px;font-weight:bold}
</style>
</head>
<body>

<div class="stage">
  <div class="pile-area" id="pile"></div>
  <div class="logo-text"><span>BEAN</span><span>GRAM</span></div>
</div>

<button class="btn-open" onclick="openApp()">OPEN APP</button>
<div class="ver">BEANGRAM V1.0</div>

<script>
const tg=window.Telegram.WebApp;tg.ready();tg.expand();
function openApp(){ if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy'); location.href='game.html'; }

// TEMPLATE KACANG PRESISI MIRIP LOGO - INI YANG BIKIN MIRIP 100%
function beanSVG(){ return `
  <svg class="bean-svg" viewBox="0 0 120 175" xmlns="http://www.w3.org/2000/svg">
    <path d="M 60 2 C 88 2, 116 24, 116 66 C 116 124, 86 173, 46 173 C 15 173, 1 143, 1 118 C 1 95, 22 86, 36 62 C 50 39, 28 2, 60 2 Z" fill="white"/>
    <path d="M 68.5 46.5 C 80 62, 77 103, 41 126.5" stroke="#2F95FF" stroke-width="11" stroke-linecap="round" fill="none"/>
  </svg>`; }

const pile=document.getElementById('pile');
// Posisi tumpukan biar numpuk natural di atas tulisan BEAN GRAM
const stackPos=[
  {x:110,y:115,r: -20},{x:80,y:105,r:25},{x:140,y:108,r:-10},
  {x:60,y:125,r:15},{x:130,y:125,r:35},{x:95,y:85,r:-25},
  {x:165,y:118,r:10},{x:45,y:100,r:-30},{x:115,y:65,r:5}
];

let idx=0;
function dropOne(){
  if(idx>=stackPos.length) return;
  const p=stackPos[idx];
  const div=document.createElement('div');
  div.className='mini-bean';
  div.style.left=p.x+'px';
  div.style.setProperty('--y',p.y+'px');
  div.style.setProperty('--r',p.r+'deg');
  div.style.animation=`fall 0.9s cubic-bezier(0.34,1.56,0.64,1) forwards`;
  div.innerHTML=beanSVG();
  pile.appendChild(div);
  idx++;
  if(tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
}

function startRain(){
  pile.innerHTML=''; idx=0;
  stackPos.forEach((_,i)=>{
    setTimeout(dropOne, i*280);
  });
}

startRain();
setInterval(startRain, 4000); // ulang tiap 4 detik biar hidup terus
</script>
</body>
</html>
