<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BeanGram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            padding: 15px 15px 80px 15px;
        }
        .page {
            display: none;
            flex-direction: column;
            flex-grow: 1;
        }
        .page.active {
            display: flex;
        }
        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-profile-top {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
        }
        .status-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
            background: #ffaa00;
            color: #000;
        }
        .btn-connect {
            background: #0088cc;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Balance Section */
        .balance-container {
            text-align: center;
            margin-top: 15px;
        }
        .balance-label {
            font-size: 11px;
            color: #8a8d93;
            letter-spacing: 1px;
        }
        .balance-value {
            font-size: 36px;
            font-weight: 800;
            color: #ffbb00;
            margin: 4px 0;
        }
        .sub-balance {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 12px;
            color: #aaa;
        }
        /* Mining Area */
        .mining-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .unclaimed-text {
            font-size: 26px;
            font-weight: 700;
            color: #00ff88;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
        .coin-wrapper {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            padding: 8px;
            background: linear-gradient(145deg, #ffbb00, #996600);
            box-shadow: 0 0 35px rgba(255, 187, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .coin-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        .action-btn-container {
            width: 100%;
            max-width: 320px;
            margin-top: 30px;
        }
        .main-btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-start {
            background: linear-gradient(90deg, #ffbb00, #ff8800);
            color: #000;
            box-shadow: 0 4px 15px rgba(255, 187, 0, 0.4);
        }
        .btn-mining {
            background: rgba(255, 255, 255, 0.08);
            color: #8a8d93;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: default;
        }
        .btn-claim {
            background: linear-gradient(90deg, #00ff88, #00b359);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
        }

        /* Profile Page Styling */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #1e2530;
            border: 2px solid #ffbb00;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 10px;
        }
        .profile-name {
            font-size: 20px;
            font-weight: bold;
        }
        .profile-id {
            font-size: 12px;
            color: #6c7079;
            margin-top: 2px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 14px;
            text-align: center;
        }
        .stat-card .val {
            font-size: 18px;
            font-weight: bold;
            color: #ffbb00;
            margin-top: 4px;
        }
        .stat-card .lbl {
            font-size: 11px;
            color: #8a8d93;
        }
        .section-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .section-title {
            font-size: 12px;
            color: #8a8d93;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .wallet-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .wallet-info {
            font-size: 13px;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: #12161f;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #6c7079;
            font-size: 11px;
            cursor: pointer;
        }
        .nav-item.active {
            color: #ffbb00;
        }
        .nav-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- PAGE 1: MINE -->
    <div id="page-mine" class="page active">
        <div class="top-bar">
            <div class="user-profile-top">
                <span id="usernameTop">Farmer</span>
                <span class="status-badge" id="statusBadge">IDLE</span>
            </div>
            <button class="btn-connect" onclick="alert('Fitur Wallet segera hadir!')">Connect Wallet</button>
        </div>

        <div class="balance-container">
            <div class="balance-label">TOTAL ASSETS</div>
            <div class="balance-value" id="totalBalance">0.0000 BGRAM</div>
            <div class="sub-balance">
                <span>Vault: <b id="vaultBalance">0.0000</b></span>
                <span>Rate: <b>+2.0 BGRAM/5h</b></span>
            </div>
        </div>

        <div class="mining-area">
            <div class="unclaimed-text" id="unclaimedText">+0.0000</div>
            <div class="coin-wrapper">
                <img src="Bgram.jpeg" alt="BeanGram Coin" class="coin-img" onerror="this.src='https://via.placeholder.com/200/0088cc/ffffff?text=BGRAM'">
            </div>
            <div class="action-btn-container">
                <button class="main-btn btn-start" id="actionBtn" onclick="handleButtonClick()">START FARMING</button>
            </div>
        </div>
    </div>

    <!-- PAGE 2: PROFILE -->
    <div id="page-profile" class="page">
        <div class="profile-header">
            <div class="profile-avatar">👤</div>
            <div class="profile-name" id="profileName">Farmer Name</div>
            <div class="profile-id" id="profileId">ID: 12345678</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="lbl">Total Farmed</div>
                <div class="val" id="profileTotal">0.0000</div>
            </div>
            <div class="stat-card">
                <div class="lbl">Miner Level</div>
                <div class="val">Lvl 1</div>
            </div>
            <div class="stat-card">
                <div class="lbl">Completed Tasks</div>
                <div class="val">0</div>
            </div>
            <div class="stat-card">
                <div class="lbl">Friends Invites</div>
                <div class="val">0</div>
            </div>
        </div>

        <div class="section-box">
            <div class="section-title">WEB3 WALLET</div>
            <div class="wallet-row">
                <div class="wallet-info">
                    <div style="font-weight: bold;">TON Wallet</div>
                    <div style="font-size: 11px; color: #8a8d93;" id="walletStatus">Not Connected</div>
                </div>
                <button class="btn-connect" onclick="alert('Integrasi Wallet TON segera hadir!')">Connect</button>
            </div>
        </div>

        <div class="section-box">
            <div class="section-title">COMMUNITY & SUPPORT</div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-connect" style="background: rgba(255,255,255,0.08); flex: 1;" onclick="window.open('https://t.me/BeanGram_Official', '_blank')">Channel</button>
                <button class="btn-connect" style="background: rgba(255,255,255,0.08); flex: 1;" onclick="alert('Fitur Support segera hadir!')">Support</button>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-mine" onclick="switchTab('mine')">
            <div class="nav-icon">⚡</div>
            <div>Mine</div>
        </div>
        <div class="nav-item" id="nav-tasks" onclick="alert('Fitur Tasks segera hadir!')">
            <div class="nav-icon">📋</div>
            <div>Tasks</div>
        </div>
        <div class="nav-item" id="nav-friends" onclick="alert('Fitur Friends segera hadir!')">
            <div class="nav-icon">👥</div>
            <div>Friends</div>
        </div>
        <div class="nav-item" id="nav-profile" onclick="switchTab('profile')">
            <div class="nav-icon">👤</div>
            <div>Profile</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const u = tg.initDataUnsafe.user;
            document.getElementById('usernameTop').innerText = u.first_name;
            document.getElementById('profileName').innerText = u.first_name + (u.last_name ? " " + u.last_name : "");
            document.getElementById('profileId').innerText = "ID: " + u.id;
        }

        const FARM_DURATION = 5 * 60 * 60 * 1000;
        const TOTAL_REWARD = 2.0;

        let totalBalance = parseFloat(localStorage.getItem('bgram_balance')) || 0;
        let miningStartTime = parseInt(localStorage.getItem('bgram_start_time')) || 0;

        const actionBtn = document.getElementById('actionBtn');
        const unclaimedText = document.getElementById('unclaimedText');
        const totalBalanceElem = document.getElementById('totalBalance');
        const vaultBalanceElem = document.getElementById('vaultBalance');
        const profileTotal = document.getElementById('profileTotal');
        const statusBadge = document.getElementById('statusBadge');

        function switchTab(tab) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            if (tab === 'mine') {
                document.getElementById('page-mine').classList.add('active');
                document.getElementById('nav-mine').classList.add('active');
            } else if (tab === 'profile') {
                document.getElementById('page-profile').classList.add('active');
                document.getElementById('nav-profile').classList.add('active');
            }
        }

        function updateUI() {
            totalBalanceElem.innerText = totalBalance.toFixed(4) + " BGRAM";
            vaultBalanceElem.innerText = totalBalance.toFixed(4);
            profileTotal.innerText = totalBalance.toFixed(4) + " BGRAM";

            if (miningStartTime === 0) {
                statusBadge.innerText = "IDLE";
                statusBadge.style.background = "#ffaa00";
                unclaimedText.innerText = "+0.0000";
                actionBtn.innerText = "START FARMING";
                actionBtn.className = "main-btn btn-start";
            } else {
                const now = Date.now();
                const elapsedTime = now - miningStartTime;

                if (elapsedTime >= FARM_DURATION) {
                    statusBadge.innerText = "READY";
                    statusBadge.style.background = "#00ff88";
                    unclaimedText.innerText = "+" + TOTAL_REWARD.toFixed(4);
                    actionBtn.innerText = "CLAIM BGRAM";
                    actionBtn.className = "main-btn btn-claim";
                } else {
                    statusBadge.innerText = "MINING";
                    statusBadge.style.background = "#0088cc";
                    
                    const progressRatio = elapsedTime / FARM_DURATION;
                    const currentReward = progressRatio * TOTAL_REWARD;
                    unclaimedText.innerText = "+" + currentReward.toFixed(4);

                    const remainingTime = FARM_DURATION - elapsedTime;
                    const hours = Math.floor(remainingTime / (1000 * 60 * 60));
                    const minutes = Math.floor((remainingTime % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((remainingTime % (1000 * 60)) / 1000);

                    const hStr = hours < 10 ? "0" + hours : hours;
                    const mStr = minutes < 10 ? "0" + minutes : minutes;
                    const sStr = seconds < 10 ? "0" + seconds : seconds;

                    actionBtn.innerText = `FARMING (${hStr}:${mStr}:${sStr})`;
                    actionBtn.className = "main-btn btn-mining";
                }
            }
        }

        function handleButtonClick() {
            const now = Date.now();
            if (miningStartTime === 0) {
                miningStartTime = now;
                localStorage.setItem('bgram_start_time', miningStartTime);
            } else if (now - miningStartTime >= FARM_DURATION) {
                totalBalance += TOTAL_REWARD;
                localStorage.setItem('bgram_balance', totalBalance);
                
                miningStartTime = 0;
                localStorage.removeItem('bgram_start_time');
            }
            updateUI();
        }

        setInterval(updateUI, 1000);
        updateUI();
    </script>
</body>
</html>
