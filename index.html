<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BeanGram</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root{--blue:#2F95FF}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--blue);height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;overflow:hidden}
  .stage{display:flex;flex-direction:column;align-items:center}
  .bean-logo{width:145px;height:auto;filter:drop-shadow(0 12px 15px rgba(0,0,0,0.25));margin-bottom:8px}
  .logo-text{font-family:'Luckiest Guy',cursive;font-size:64px;line-height:0.85;color:white;text-align:center;-webkit-text-stroke:4.5px black;text-shadow:6px 7px 0 black;transform:rotate(-4deg)}
  .logo-text span{display:block}
  .btn-open{margin-top:40px;border:2.5px solid white;background:rgba(255,255,255,0.18);color:white;padding:13px 44px;border-radius:35px;font-weight:900;letter-spacing:1.5px;font-size:15px;cursor:pointer;backdrop-filter:blur(6px)}
  .btn-open:active{transform:scale(0.95);background:white;color:var(--blue)}
  .ver{position:absolute;bottom:22px;font-size:10px;opacity:0.75;color:white;letter-spacing:4px;font-weight:bold}
</style>
</head>
<body>
<div class="stage">
  <!-- LOGO BEANGRAM ASLI - 3 KACANG -->
  <svg class="bean-logo" viewBox="0 0 200 145" xmlns="http://www.w3.org/2000/svg">
    <!-- kacang 1 kiri -->
    <g transform="translate(10,15) rotate(-22)">
      <path d="M 30 2 C 44 2, 58 12, 58 33 C 58 62, 43 86, 23 86 C 7 86, 0 71, 0 59 C 0 47, 11 43, 18 31 C 25 19, 14 2, 30 2 Z" fill="white"/>
      <path d="M 34 23 C 40 31, 38 51, 20 63" stroke="#2F95FF" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    </g>
    <!-- kacang 2 tengah atas -->
    <g transform="translate(70,5) rotate(18)">
      <path d="M 30 2 C 44 2, 58 12, 58 33 C 58 62, 43 86, 23 86 C 7 86, 0 71, 0 59 C 0 47, 11 43, 18 31 C 25 19, 14 2, 30 2 Z" fill="white"/>
      <path d="M 34 23 C 40 31, 38 51, 20 63" stroke="#2F95FF" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    </g>
    <!-- kacang 3 kanan bawah -->
    <g transform="translate(102,48) rotate(-8)">
      <path d="M 30 2 C 44 2, 58 12, 58 33 C 58 62, 43 86, 23 86 C 7 86, 0 71, 0 59 C 0 47, 11 43, 18 31 C 25 19, 14 2, 30 2 Z" fill="white"/>
      <path d="M 34 23 C 40 31, 38 51, 20 63" stroke="#2F95FF" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    </g>
  </svg>

  <div class="logo-text"><span>BEAN</span><span>GRAM</span></div>
</div>

<button class="btn-open" onclick="location.href='game.html'">OPEN APP</button>
<div class="ver">BEANGRAM V1.0</div>

<script>Telegram.WebApp.ready();Telegram.WebApp.expand();</script>
</body>
</html>
