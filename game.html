<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#ffef9c;font-family:'Comic Sans MS',sans-serif;text-align:center}
.factory{background:#fff6a0;border-bottom:6px solid #5a3e00;padding:10px}
.machine{width:90%;max-width:360px;margin:18px auto;background:#fff;border:4px solid #333;border-radius:20px;padding:14px;box-shadow:6px 6px 0 #333}
.bean{font-size:44px;animation:bounce 1s infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.btn{padding:16px 24px;background:#3ec700;border:4px solid #000;border-radius:999px;font-weight:900;font-size:18px;box-shadow:0 6px 0 #000;cursor:pointer;width:90%}
.bar{height:14px;background:#ddd;border:3px solid #000;border-radius:999px;overflow:hidden}
.bar div{height:100%;background:#3ec700;width:62%}
</style></head><body>
<div class="factory"><b>WONKA'S BEAN FACTORY - BEAN MINTING DIVISION</b><br>BEANS: <span id="bc">1,284</span> | ENERGY: 85/100</div>
<div class="machine">
<div class="bean">🫘</div>
<div style="font-weight:900;font-size:20px">BEAN MIXER 3000</div>
<div class="bar"><div id="prog"></div></div>
<div style="margin:10px 0" id="status">Factory Status: OPERATIONAL<br>BEANS/HR: 420 ↑</div>
<button class="btn" onclick="mint()">PRESS TO MINT</button>
<div style="margin-top:10px;font-size:12px">INVENTORY: <span id="inv">12 COMMON • 3 RARE • 1 GOLDEN</span></div>
</div>
<script>
let c=1284;function mint(){c++;document.getElementById('bc').innerText=c;document.getElementById('prog').style.width=(c%100)+'%';Telegram.WebApp.HapticFeedback.impactOccurred('heavy');let s=document.createElement('div');s.innerText='🫘 +1';s.style.position='fixed';s.style.left='50%';s.style.top='50%';s.style.fontSize='32px';s.style.animation='bounce .8s';document.body.appendChild(s);setTimeout(()=>s.remove(),800)}
</script></body></html>
